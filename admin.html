<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المالك - Flowers Al Aqhawan</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-wrapper">
        <div class="login-container" id="loginContainer">
            <div class="login-box">
                <h2>🔐 دخول المالك</h2>
                <p class="developer-login">💻 𝑵𝑬𝑿_𝑫𝑬𝑽_𝑽1</p>
                <input type="password" id="passwordInput" placeholder="أدخل كلمة السر" class="password-input">
                <button onclick="verifyPassword()" class="login-btn">دخول</button>
                <p id="loginError" class="error-msg"></p>
            </div>
        </div>

        <div class="admin-panel" id="adminPanel" style="display:none;">
            <div class="admin-header">
                <h1>🌼 لوحة تحكم المالك</h1>
                <p>💻 𝑵𝑬𝑿_𝑫𝑬𝑽_𝑽1</p>
                <button onclick="logout()" class="logout-btn">🚪 خروج</button>
            </div>

            <div class="admin-content">
                <div class="add-product-form">
                    <h2>➕ إضافة منتج جديد</h2>
                    <input type="text" id="newImage" placeholder="رابط الصورة" class="admin-input">
                    <input type="text" id="newDescription" placeholder="وصف المنتج" class="admin-input">
                    <input type="text" id="newPrice" placeholder="السعر (مثال: 600 ليرة سورية)" class="admin-input">
                    <button onclick="addProduct()" class="add-btn">➕ إضافة المنتج</button>
                </div>

                <div class="products-list" id="adminProductsList">
                    <!-- سيتم عرض المنتجات هنا -->
                </div>
            </div>
        </div>
    </div>
    <script src="admin-script.js"></script>
</body>
</html>

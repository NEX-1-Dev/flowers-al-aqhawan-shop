<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المالك - Flowers Al Aqhawan</title>
    <link rel="stylesheet" href="admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="admin-wrapper">
        <div class="login-container" id="loginContainer">
            <div class="login-box">
                <h2>🔐 دخول المالك</h2>
                <p class="developer-login">💻 𝑵𝑬𝑿_𝑫𝑬𝑽_𝑽1</p>
                <input type="password" id="passwordInput" placeholder="أدخل كلمة السر" class="password-input">
                <button onclick="verifyPassword()" class="login-btn">دخول</button>
                <p id="loginError" class="error-msg"></p>
            </div>
        </div>

        <div class="admin-panel" id="adminPanel" style="display:none;">
            <div class="admin-header">
                <h1>🌼 لوحة تحكم المالك</h1>
                <p>💻 𝑵𝑬𝑿_𝑫𝑬𝑽_𝑽1</p>
                <div class="admin-actions-header">
                    <button onclick="copyShopLink()" class="copy-link-btn"><i class="fas fa-copy"></i> نسخ الرابط</button>
                    <button onclick="logout()" class="logout-btn"><i class="fas fa-sign-out-alt"></i> خروج</button>
                </div>
            </div>

            <div class="admin-content">
                <!-- ===== قسم إدارة الإعلانات ===== -->
                <div class="announcement-control">
                    <h2><i class="fas fa-bullhorn"></i> إدارة الإعلانات</h2>
                    <p class="admin-hint">💡 الإعلانات تظهر في شريط متحرك أعلى الموقع</p>
                    <div class="announcement-list" id="announcementList">
                        <!-- سيتم عرض الإعلانات هنا -->
                    </div>
                    <div class="add-announcement-form">
                        <h3>➕ إضافة إعلان جديد</h3>
                        <input type="text" id="announcementImage" placeholder="رابط صورة الإعلان" class="admin-input">
                        <input type="text" id="announcementText" placeholder="نص الإعلان" class="admin-input">
                        <button onclick="addAnnouncement()" class="add-announcement-btn"><i class="fas fa-plus"></i> إضافة إعلان</button>
                    </div>
                    <button onclick="saveAnnouncements()" class="save-announcements-btn"><i class="fas fa-save"></i> حفظ الإعلانات</button>
                </div>

                <!-- ===== قسم الرسالة الترحيبية ===== -->
                <div class="welcome-control">
                    <h2><i class="fas fa-gift"></i> الرسالة الترحيبية</h2>
                    <p class="admin-hint">💡 تظهر عند فتح الموقع لأول مرة</p>
                    <input type="text" id="welcomeMessageInput" placeholder="أدخل نص الرسالة الترحيبية" class="admin-input">
                    <button onclick="updateWelcomeMessage()" class="update-welcome-btn"><i class="fas fa-sync"></i> تحديث الرسالة</button>
                </div>

                <!-- ===== إضافة منتج ===== -->
                <div class="add-product-form">
                    <h2>➕ إضافة منتج جديد</h2>
                    <input type="text" id="newImage" placeholder="رابط الصورة" class="admin-input">
                    <input type="text" id="newDescription" placeholder="وصف المنتج" class="admin-input">
                    <input type="text" id="newPrice" placeholder="السعر (مثال: 600 ليرة سورية)" class="admin-input">
                    <select id="newCategory" class="admin-input">
                        <option value="mixed">🌈 ألوان مختلطة</option>
                        <option value="warm">🔥 ألوان دافئة</option>
                        <option value="pastel">🌸 ألوان باستيل</option>
                    </select>
                    <button onclick="addProduct()" class="add-btn"><i class="fas fa-plus"></i> إضافة المنتج</button>
                </div>

                <!-- ===== قائمة المنتجات ===== -->
                <div class="products-section">
                    <h2><i class="fas fa-list"></i> قائمة المنتجات</h2>
                    <button onclick="showProducts()" class="show-products-btn"><i class="fas fa-eye"></i> عرض المنتجات</button>
                    <div class="products-list" id="adminProductsList">
                        <!-- سيتم عرض المنتجات هنا -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="admin-script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المالك - Flowers Al Aqhawan</title>
    <link rel="stylesheet" href="admin-style.css">
</head>
<body>
    <div class="admin-wrapper">
        <div class="login-container" id="loginContainer">
            <div class="login-box">
                <h2>🔐 دخول المالك</h2>
                <p class="developer-login">💻 𝑵𝑬𝑿_𝑫𝑬𝑽_𝑽1</p>
                <input type="password" id="passwordInput" placeholder="أدخل كلمة السر" class="password-input">
                <button onclick="verifyPassword()" class="login-btn">دخول</button>
                <p id="loginError" class="error-msg"></p>
            </div>
        </div>

        <div class="admin-panel" id="adminPanel" style="display:none;">
            <div class="admin-header">
                <h1>🌼 لوحة تحكم المالك</h1>
                <p>💻 𝑵𝑬𝑿_𝑫𝑬𝑽_𝑽1</p>
                <div class="admin-actions-header">
                    <button onclick="copyShopLink()" class="copy-link-btn">📋 نسخ رابط المتجر</button>
                    <button onclick="logout()" class="logout-btn">🚪 خروج</button>
                </div>
            </div>

            <div class="admin-content">
                <!-- قسم الإعلانات -->
                <div class="announcement-control">
                    <h2>📢 إدارة الإعلان</h2>
                    <div class="announcement-input-group">
                        <input type="text" id="announcementInput" placeholder="أدخل نص الإعلان الجديد" class="admin-input">
                        <button onclick="updateAnnouncementFromAdmin()" class="update-announcement-btn">🔄 تحديث الإعلان</button>
                    </div>
                    <button onclick="showProducts()" class="show-products-btn">🌹 عرض المنتجات</button>
                </div>

                <div class="add-product-form">
                    <h2>➕ إضافة منتج جديد</h2>
                    <input type="text" id="newImage" placeholder="رابط الصورة" class="admin-input">
                    <input type="text" id="newDescription" placeholder="وصف المنتج" class="admin-input">
                    <input type="text" id="newPrice" placeholder="السعر (مثال: 600 ليرة سورية)" class="admin-input">
                    <select id="newCategory" class="admin-input">
                        <option value="mixed">🌈 ألوان مختلطة</option>
                        <option value="warm">🔥 ألوان دافئة</option>
                        <option value="pastel">🌸 ألوان باستيل</option>
                    </select>
                    <button onclick="addProduct()" class="add-btn">➕ إضافة المنتج</button>
                </div>

                <div class="products-list" id="adminProductsList">
                    <!-- سيتم عرض المنتجات هنا -->
                </div>
            </div>
        </div>
    </div>
    <script src="admin-script.js"></script>
</body>
</html>
